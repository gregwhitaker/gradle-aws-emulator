name: AWS Emulator upgrade

on:
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-emulator-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Test upgrade tooling
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Open a draft upgrade PR and start compatibility checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update-emulator.py --create-pr
