name: Publish to Gradle Plugin Portal

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gradle-plugin-portal
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify release tag
        shell: bash
        run: |
          version="$(sed -n 's/^pluginVersion=//p' gradle.properties | tr -d '\r')"
          if [[ -z "$version" || "$version" == *SNAPSHOT* ]]; then
            echo "::error::pluginVersion must be a non-SNAPSHOT release version."
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Publish from tag v$version, matching pluginVersion in gradle.properties."
            exit 1
          fi
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Build, test, and validate publication
        run: ./gradlew build :plugin:integrationTest :plugin:publishPlugins --validate-only --no-daemon
      - name: Publish plugin
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          : "${GRADLE_PUBLISH_KEY:?Set the GRADLE_PUBLISH_KEY repository secret.}"
          : "${GRADLE_PUBLISH_SECRET:?Set the GRADLE_PUBLISH_SECRET repository secret.}"
          ./gradlew :plugin:publishPlugins --no-daemon
