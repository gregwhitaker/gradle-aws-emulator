name: Publish to Gradle Plugin Portal

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gradle-plugin-portal
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test release guard
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Verify release metadata
        run: python3 scripts/verify-release.py
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Build and test
        run: ./gradlew build :plugin:integrationTest :spring-boot-plugin:integrationTest --no-daemon
      - name: Publish to isolated local repository
        run: ./gradlew :plugin:publishToMavenLocal :spring-boot-plugin:publishToMavenLocal "-Dmaven.repo.local=${{ runner.temp }}/plugin-publication" --no-daemon
      - name: Verify published artifacts and configuration-cache reuse
        run: bash scripts/smoke-test-publication.sh "${{ runner.temp }}/plugin-publication"
      - name: Validate and publish plugins
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          : "${GRADLE_PUBLISH_KEY:?Set the GRADLE_PUBLISH_KEY repository secret.}"
          : "${GRADLE_PUBLISH_SECRET:?Set the GRADLE_PUBLISH_SECRET repository secret.}"
          ./gradlew :plugin:publishPlugins --validate-only :spring-boot-plugin:publishPlugins --validate-only --no-daemon
          ./gradlew :plugin:publishPlugins :spring-boot-plugin:publishPlugins --no-daemon
