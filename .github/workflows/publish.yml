name: Publish to Gradle Plugin Portal

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gradle-plugin-portal
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release and successful CI
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify release metadata
        run: python3 scripts/verify-release.py
      - name: Require successful main CI for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify-release-ci.py

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Validate and publish plugins
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          : "${GRADLE_PUBLISH_KEY:?Set the GRADLE_PUBLISH_KEY repository secret.}"
          : "${GRADLE_PUBLISH_SECRET:?Set the GRADLE_PUBLISH_SECRET repository secret.}"
          # The verify job requires this exact commit's full main CI to pass.
          ./gradlew :plugin:publishPlugins --validate-only :spring-boot-plugin:publishPlugins --validate-only -x check --no-daemon
          ./gradlew :plugin:publishPlugins :spring-boot-plugin:publishPlugins -x check --no-daemon

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish GitHub release from changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-github-release.py
