name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            java: '17'
            gradle: '8.14.3'
          - os: ubuntu-latest
            java: '21'
            gradle: '9.6.1'
          - os: windows-latest
            java: '21'
            gradle: '9.6.1'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: ${{ matrix.gradle }}
      - run: gradle build --no-daemon

  docker:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - run: ./gradlew :plugin:integrationTest --no-daemon
