name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            java: '17'
            gradle: '8.14.3'
          - os: ubuntu-latest
            java: '21'
            gradle: '9.6.1'
          - os: windows-latest
            java: '21'
            gradle: '9.6.1'
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: ${{ matrix.gradle }}
      - run: gradle build :plugin:publishToMavenLocal :spring-boot-plugin:publishToMavenLocal "-Dmaven.repo.local=${{ runner.temp }}/plugin-publication" --continue --no-daemon
      - name: Smoke-test published plugins and configuration-cache reuse
        shell: bash
        env:
          GRADLE: gradle
        run: bash scripts/smoke-test-publication.sh "${{ runner.temp }}/plugin-publication"

  release-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: bash -n scripts/smoke-test-publication.sh

  cloudformation-audit:
    name: CloudFormation audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Require a catalogue audited for the shared emulator version
        run: ./gradlew :plugin:test --tests 'io.github.gregwhitaker.awsemulator.aws.cloudformation.CloudFormationAuditTest' --no-daemon

  docker:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        gradle: ['8.14.3', '9.6.1']
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: ${{ matrix.gradle }}
      - run: gradle :plugin:integrationTest :spring-boot-plugin:integrationTest --continue --no-daemon
      - name: Verify the basic consumer and configuration-cache reuse
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          args=(-p examples/basic integrationTest --configuration-cache --configuration-cache-problems=fail --no-daemon --console=plain)
          gradle "${args[@]}"
          gradle "${args[@]}" | tee "$RUNNER_TEMP/emulator-configuration-cache.log"
          grep -Fq 'Configuration cache entry reused.' "$RUNNER_TEMP/emulator-configuration-cache.log"

  emulator-compatibility:
    name: Emulator compatibility
    if: ${{ always() }}
    needs: [test, release-tools, cloudformation-audit, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every compatibility and audit check to pass
        env:
          BUILD: ${{ needs.test.result }}
          TOOLS: ${{ needs.release-tools.result }}
          AUDIT: ${{ needs.cloudformation-audit.result }}
          DOCKER: ${{ needs.docker.result }}
        run: test "$BUILD" = success && test "$TOOLS" = success && test "$AUDIT" = success && test "$DOCKER" = success
