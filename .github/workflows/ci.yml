name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            java: '17'
            gradle: '8.14.3'
          - os: ubuntu-latest
            java: '21'
            gradle: '9.6.1'
          - os: windows-latest
            java: '21'
            gradle: '9.6.1'
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: ${{ matrix.gradle }}
      - run: gradle build :plugin:publishToMavenLocal :spring-boot-plugin:publishToMavenLocal "-Dmaven.repo.local=${{ runner.temp }}/plugin-publication" --no-daemon
      - name: Smoke-test published plugins and configuration-cache reuse
        shell: bash
        env:
          GRADLE: gradle
        run: bash scripts/smoke-test-publication.sh "${{ runner.temp }}/plugin-publication"

  release-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: bash -n scripts/smoke-test-publication.sh

  docker:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - run: ./gradlew :plugin:integrationTest :spring-boot-plugin:integrationTest --no-daemon
